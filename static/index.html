<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Xena">
  <meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)">
  <title>Xena</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="/static/icons/xena-192.png">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-row">
      <span class="brand">Xena</span>
      <button class="ibtn flash-btn" id="flash-btn" aria-label="Écouter ce que j'ai raté">▶<span id="flash-count" class="badge"></span></button>
      <button class="ibtn" id="settings-btn" aria-label="Réglages">⚙︎</button>
    </div>
    <nav class="tabs" id="tabs">
      <button data-filtre="top" class="tab active">Importantes</button>
      <button data-filtre="all" class="tab">Tout</button>
      <button data-filtre="taches" class="tab">Tâches <span id="taches-count" class="badge"></span></button>
    </nav>
  </header>

  <div id="settings" class="settings" hidden>
    <label>Vitesse de lecture <output id="speed-out">0.90×</output>
      <input type="range" id="speed" min="0.6" max="1.25" step="0.05" value="0.9">
    </label>
    <label>Voix des réponses
      <select id="voice-mode">
        <option value="gemini">Gemini (naturelle)</option>
        <option value="browser">Navigateur (gratuite)</option>
      </select>
    </label>
    <div class="wide push-box">
      <div class="push-head">Notifications <span class="note" id="push-state"></span></div>
      <div class="push-row">
        <button class="btn ghost" id="push-toggle" hidden></button>
        <button class="btn ghost" id="push-test" hidden>Tester</button>
        <select id="r-seuil_push" aria-label="Seuil des notifications">
          <option value="exceptionnel">Méga-dingueries seulement</option>
          <option value="important">Un peu plus large</option>
        </select>
      </div>
      <p class="note" id="push-help" hidden></p>
      <ul class="note push-log" id="push-log"></ul>
    </div>
    <label class="wide">Composants de ton infra <small>un par ligne, synonymes séparés par des virgules</small>
      <textarea id="r-composants_critiques" rows="8"></textarea>
    </label>
    <label class="wide">Questions négatives de la synthèse <small>une par ligne</small>
      <textarea id="r-questions_negatives" rows="7"></textarea>
    </label>
    <label class="wide">Profil <small>sert à juger l'impact sur toi</small>
      <textarea id="r-profil" rows="4"></textarea>
    </label>
    <label class="check"><input type="checkbox" id="r-contradicteur"> Contradicteur de la synthèse</label>
    <div class="wide"><button class="btn" id="r-save">Enregistrer</button> <span class="note" id="r-status"></span></div>
  </div>

  <main id="feed" class="feed"></main>

  <button id="talk-fab" class="fab" aria-label="Parler à Xena">🎙</button>

  <div id="player-bar" class="player-bar" hidden>
    <div class="player-info">
      <div class="player-kicker" id="player-kicker"></div>
      <div class="player-label" id="player-label"></div>
      <div class="progress"><div id="progress-fill"></div></div>
    </div>
    <div class="player-controls">
      <button class="ctrl" id="p-prev" aria-label="Précédent">⏮</button>
      <button class="ctrl main" id="p-toggle" aria-label="Lecture / pause">⏸</button>
      <button class="ctrl" id="p-next" aria-label="Suivant">⏭</button>
      <button class="ctrl" id="p-dig" aria-label="En parler">🎙</button>
      <button class="ctrl" id="p-close" aria-label="Arrêter">✕</button>
    </div>
    <audio id="player" preload="auto" playsinline></audio>
  </div>

  <aside id="chat" class="chat" hidden>
    <div class="chat-head">
      <div class="chat-tools">
        <button class="ibtn" id="stop-voice" aria-label="Couper la voix">⏹</button>
        <button class="ibtn" id="replay" aria-label="Répéter">↻</button>
        <button class="ibtn" id="clear-chat" aria-label="Nouvelle conversation">＋</button>
        <button class="ibtn" id="to-gemini" aria-label="Continuer dans Gemini">↗</button>
      </div>
      <button class="ibtn" id="chat-close" aria-label="Fermer">✕</button>
    </div>
    <div id="focus" class="focus" hidden>
      <b id="focus-title"></b>
      <button class="link-btn" id="focus-clear" aria-label="Parler de tout">✕</button>
    </div>
    <div class="chat-log" id="chat-log"></div>
    <div class="chat-status" id="chat-status"></div>
    <div class="chat-controls">
      <button id="mic" class="mic" aria-label="Parler">
        <span id="mic-label">🎙</span>
      </button>
      <form id="chat-form" class="chat-form">
        <input id="chat-input" type="text" placeholder="Écrire…" autocomplete="off" enterkeyhint="send">
      </form>
    </div>
  </aside>

  <script src="/static/app.js"></script>
</body>
</html>
